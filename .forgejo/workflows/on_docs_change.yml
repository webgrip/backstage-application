name: '[Workflow] On Documentation Change'

# Publishes this repo's docs to docs.<domain>/backstage-application/ — the
# homelab ADR-0052 estate rollout. NOTE: mkdocs.yml lives at the repo ROOT
# (docs/ beside it), hence source-dir '.'.

on:
  push:
    branches:
      - '*'
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.forgejo/workflows/on_docs_change.yml'
  workflow_dispatch:
    inputs:
      source-dir:
        type: string
        description: 'The directory containing mkdocs.yml'
        required: false
        default: '.'

jobs:
  generate-documentation:
    name: 'Generate'
    uses: webgrip/workflows/.forgejo/workflows/techdocs-generate.yml@abf3c951d8243ef030421ab2acff0af9edce3215 # main
    with:
      source-dir: ${{ github.event.inputs.source-dir || '.' }}

  deploy-docs-site:
    name: 'Deploy (docs site / Garage web)'
    uses: webgrip/workflows/.forgejo/workflows/techdocs-deploy-docs-site.yml@abf3c951d8243ef030421ab2acff0af9edce3215 # main
    needs: generate-documentation
    if: github.ref == 'refs/heads/main'
    with:
      source-dir: '.'
      dest-prefix: backstage-application
      strict: 'true'
    secrets:
      TECHDOCS_S3_ACCESS_KEY_ID: ${{ secrets.TECHDOCS_S3_ACCESS_KEY_ID }}
      TECHDOCS_S3_SECRET_ACCESS_KEY: ${{ secrets.TECHDOCS_S3_SECRET_ACCESS_KEY }}
