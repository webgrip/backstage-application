# Kubernetes overlay — NOT loaded by default. The homelab-cluster Deployment opts
# in by overriding the container args:
#   node packages/backend --config app-config.yaml --config app-config.k8s.yaml
# Local dev (docker-compose / yarn start) never loads this file, so the
# TECHDOCS_* env vars are only required in-cluster.
#
# TechDocs external-builder storage (homelab-cluster ADR-0039): CI builds the
# docs and publishes them into the Garage `techdocs` bucket with techdocs-cli;
# Backstage only serves prebuilt objects (`builder: external` — never builds on
# read). Credentials are the READ-ONLY half of the Garage-minted key pair,
# injected via the backstage-techdocs-s3 ExternalSecret.
techdocs:
  builder: ${TECHDOCS_BUILDER}
  publisher:
    type: "awsS3"
    awsS3:
      bucketName: ${TECHDOCS_S3_BUCKET}
      endpoint: ${TECHDOCS_S3_ENDPOINT}
      region: ${TECHDOCS_S3_REGION}
      s3ForcePathStyle: true
      credentials:
        accessKeyId: ${TECHDOCS_S3_ACCESS_KEY_ID}
        secretAccessKey: ${TECHDOCS_S3_SECRET_ACCESS_KEY}
